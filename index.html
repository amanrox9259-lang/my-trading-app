<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TradeX Real</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}
.header{
  padding:18px 16px;
  background:#0b1728;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #1b2a40;
}
.logo{font-size:22px;font-weight:bold}
.demo{
  background:#16365b;
  color:#55b6ff;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
}
.balance{
  margin:15px;
  padding:18px;
  background:linear-gradient(135deg,#102b48,#0b1b2e);
  border-radius:16px;
}
.balance small{color:#8fa4bd}
.balance h1{margin:7px 0;font-size:30px}
.tabs{
  display:flex;
  gap:8px;
  padding:0 15px 15px;
}
.tab{
  flex:1;
  padding:12px;
  background:#101f33;
  border:0;
  border-radius:10px;
  color:#aabbd0;
}
.active{background:#1677ff;color:white}
.card{
  margin:0 15px 15px;
  padding:15px;
  background:#0d1b2d;
  border-radius:16px;
}
.market{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.market b{font-size:18px}
.price{font-size:25px;margin-top:5px}
.up{color:#22d49b}
.chart{
  height:220px;
  margin-top:15px;
  border-radius:12px;
  background:
    linear-gradient(#14263c 1px,transparent 1px),
    linear-gradient(90deg,#14263c 1px,transparent 1px);
  background-size:45px 45px;
  position:relative;
  overflow:hidden;
}
svg{width:100%;height:100%}
.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}
.action{
  flex:1;
  padding:15px;
  border:0;
  border-radius:12px;
  color:white;
  font-size:16px;
  font-weight:bold;
}
.buy{background:#0ba878}
.sell{background:#e94d65}
.info{
  display:flex;
  justify-content:space-between;
  color:#8fa4bd;
  font-size:13px;
  margin-top:15px;
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#0b1728;
  border-top:1px solid #1b2a40;
  display:flex;
  justify-content:space-around;
  padding:12px 5px;
}
.bottom div{text-align:center;color:#8094ac;font-size:12px}
.bottom .selected{color:#42a5ff}
.space{height:70px}
</style>
</head>

<body>

<div class="header">
  <div class="logo">TradeX</div>
  <div class="Real">LIVE MODE</div>
</div>

<div class="balance">
  <small>Real Wallet Balance</small>
  <h1 id="balance">₹10,000.00</h1>
  <span class="up">+ ₹250.00 Today</span>
</div>

<div class="tabs">
  <button class="tab active">Stocks</button>
  <button class="tab">Crypto</button>
  <button class="tab">Forex</button>
</div>

<div class="card">

  <div class="market">
    <div>
      <b>BTC / USD</b>
      <div style="color:#8195ad;font-size:12px">Bitcoin</div>
    </div>
    <div style="text-align:right">
      <div class="price" id="price">$67,420.50</div>
      <div class="up">+2.41%</div>
    </div>
  </div>

  <div class="chart">
    <svg viewBox="0 0 500 220" preserveAspectRatio="none">
      <polyline
        id="line"
        fill="none"
        stroke="#21d49b"
        stroke-width="4"
        points="
        0,170 35,155 65,165 95,130
        125,145 155,110 185,125
        215,95 245,105 275,75
        305,90 335,60 365,72
        395,45 430,55 465,30 500,40"/>
    </svg>
  </div>

  <div class="info">
    <span>24h High: $68,120</span>
    <span>24h Low: $65,210</span>
  </div>

  <div class="actions">
    <button class="action buy" onclick="trade('BUY')">BUY</button>
    <button class="action sell" onclick="trade('SELL')">SELL</button>
  </div>

</div>

<div class="card">
  <b>Open Position</b>
  <p id="position" style="color:#8195ad">
    No open position
  </p>
</div>

<div class="space"></div>

<div class="bottom">
  <div class="selected">⌂<br>Home</div>
  <div>▣<br>Markets</div>
  <div>↕<br>Trade</div>
  <div>◷<br>Orders</div>
  <div>●<br>Profile</div>
</div>

<script>
let balance = 10000;
let price = 67420.50;

function trade(type){
  const amount = 100;

  if(type === "BUY"){
    balance -= amount;
    document.getElementById("position").innerHTML =
      "BUY position opened • ₹100 • Real";
  }else{
    balance += amount;
    document.getElementById("position").innerHTML =
      "SELL position opened • ₹100 • Real";
  }

  document.getElementById("balance").innerText =
    "₹" + balance.toFixed(2);
}

setInterval(function(){
  price += (Math.random()-0.5)*20;

  document.getElementById("price").innerText =
    "$" + price.toFixed(2);
},2000);
</script>

</body>
</html>
